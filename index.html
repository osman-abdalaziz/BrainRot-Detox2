<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainRot Detox | KLOBLHOB Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=20">
</head>

<body>

    <div class="auth-container">
        <div class="brand" style="margin-bottom: 10px;">
            <img src="images/logo.webp" alt="BrainRot Detox" style="width: 250px;">
        </div>
        <p>KLOBLHOB Edition - الدخول حصري للأعضاء فقط</p>

        <form id="login-form" class="form-section">
            <h2>تسجيل الدخول</h2>
            <label for="login-email" class="sr-only">البريد الإلكتروني</label>
            <input type="email" id="login-email" placeholder="البريد الإلكتروني" required>
            <label for="login-password" class="sr-only">كلمة المرور</label>
            <div class="password-container">
                <input type="password" id="login-password" placeholder="كلمة المرور" required>
                <i class="fa-solid fa-eye toggle-password" data-target="login-password"></i>
            </div>
            <p style="text-align: right; margin-top: -10px; margin-bottom: 15px;">
                <a href="#" id="forgot-password-link"
                    style="color: var(--text-muted); font-size: 13px; text-decoration: underline;">نسيت كلمة المرور؟</a>
            </p>
            <button type="submit" id="login-btn">دخول</button>
            <p>ليس لديك حساب؟ <span id="show-register" class="toggle-link">سجل الآن</span></p>
        </form>

        <form id="register-form" class="form-section" style="display: none;">
            <h2>إنشاء حساب جديد</h2>
            <label for="reg-name" class="sr-only">الاسم الكامل</label>
            <input type="text" id="reg-name" placeholder="الاسم الكامل" required>
            <label for="reg-email" class="sr-only">البريد الإلكتروني</label>
            <input type="email" id="reg-email" placeholder="البريد الإلكتروني" required>
            <label for="reg-password" class="sr-only">كلمة المرور</label>
            <div class="password-container">
                <input type="password" id="reg-password" placeholder="كلمة المرور" required>
                <i class="fa-solid fa-eye toggle-password" data-target="reg-password"></i>
            </div>
            <label for="reg-invite-code" class="sr-only">كود التفعيل (مطلوب)</label>
            <input type="text" id="reg-invite-code" placeholder="كود التفعيل (مطلوب)" required>
            <button type="submit" id="register-btn">إنشاء حساب</button>
            <p>لديك حساب بالفعل؟ <span id="show-login" class="toggle-link">سجل دخول</span></p>
        </form>
        <form id="reset-password-form" class="form-section" style="display: none;">
            <h2>استعادة كلمة المرور</h2>
            <p style="font-size: 14px; margin-bottom: 20px; color: var(--text-muted);">أدخل بريدك الإلكتروني وسنرسل لك
                رابطاً
                لتعيين كلمة مرور جديدة.</p>
            <label for="reset-email" class="sr-only">البريد الإلكتروني</label>
            <input type="email" id="reset-email" placeholder="البريد الإلكتروني" required>
            <button type="submit" id="reset-btn" style="background: #3b82f6;">إرسال الرابط 📧</button>
            <p style="margin-top: 15px;"><span id="back-to-login" class="toggle-link">العودة لتسجيل الدخول</span></p>
        </form>
    </div>

    <script type="module" src="js/firebase-config.js?v=20"></script>
    <script type="module" src="js/auth.js?v=20"></script>
</body>

</html>
