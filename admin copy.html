<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم KLOBLHOB | الإدارة</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="admin-container">
        <h1>لوحة تحكم الإدارة</h1>
        <button id="logout-btn"
            style="background-color: #ff4c4c; color: white; border: none; padding: 10px; cursor: pointer;">تسجيل
            خروج</button>

        <hr style="margin: 20px 0;">

        <div class="admin-section">
            <h2>إضافة كود تفعيل جديد</h2>
            <input type="text" id="new-code-input" placeholder="أدخل الكود (مثال: KOLO-OS-1)">
            <button id="generate-code-btn">حفظ الكود</button>
            <p id="code-status" style="color: green; font-weight: bold; margin-top: 10px;"></p>
        </div>

        <hr style="margin: 20px 0;">

        <div class="admin-section">
            <h2>إضافة مهمة جديدة للتحديات</h2>
            <p style="font-size: 14px; color: #666;">المهام التي تضاف هنا ستظهر لكل الأعضاء في التحدي القادم.</p>
            <input type="text" id="task-name" placeholder="اسم المهمة (مثال: صلاة الفجر في المسجد)">
            <input type="number" id="task-points" placeholder="النقاط المستحقة (مثال: 20)">
            <button id="add-task-btn">إضافة المهمة</button>
            <p id="task-status" style="color: green; font-weight: bold; margin-top: 10px;"></p>
        </div>
        <hr style="margin: 20px 0;">

        <div class="admin-section">
            <h2>إطلاق تحدي جديد</h2>
            <p style="font-size: 14px; color: #666;">سيتم تفعيل هذا التحدي لجميع الأعضاء فور إطلاقه.</p>
            <input type="text" id="challenge-title" placeholder="اسم التحدي (مثال: تحدي الـ 7 أيام)">
            <input type="number" id="challenge-days" placeholder="مدة التحدي بالأيام (مثال: 7)">
            <input type="number" id="challenge-daily-target" placeholder="الحد الأدنى للنقاط اليومية (مثال: 150)">
            <button id="start-challenge-btn" style="background-color: #28a745;">إطلاق التحدي الآن</button>
            <p id="challenge-status" style="color: green; font-weight: bold; margin-top: 10px;"></p>
        </div>
    </div>


    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>

</html>
