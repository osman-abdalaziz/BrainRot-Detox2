<section id="profile-page" class="page-section">
    <h2 class="gold-text" style="margin-bottom: 20px;">الملف الشخصي</h2>
    <div class="glass-card" style="max-width: 500px; margin: 0 auto; text-align: center;">
        <div id="profile-avatar-wrapper" class="avatar-wrapper"
            style="width: 140px; height: 140px; margin-bottom: 15px;">
            <img src="images/profile.webp" alt="Profile" id="profile-avatar-preview">
        </div>
        <input type="file" id="avatar-upload" accept="image/*" style="display: none;">
        <button id="trigger-upload-btn" class="gold-btn upload-btn">تغيير الصورة</button>
        <div
            style="background: rgba(0,0,0,0.2); border: 1px solid var(--gold-primary); padding: 20px; border-radius: 12px; margin: 25px auto; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <h4 style="color: var(--text-muted); font-size: 13px; margin-bottom: 5px;">الرتبة العسكرية
                الحالية</h4>
            <h2 id="profile-rank-title" class="gold-text"
                style="font-size: 28px; margin-bottom: 15px; text-shadow: 0 0 10px rgba(168, 85, 247, 0.6)">
                متدرب</h2>

            <div
                style="display: flex; justify-content: space-between; align-items: center; font-size: 15px; margin-bottom: 8px;">
                <span style="color: var(--text-main);">نقاط الشرف:</span>
                <strong id="profile-lifetime-score" style="color: var(--success); font-size: 18px; font-weight: bold;">0
                    XP</strong>
            </div>

            <div
                style="width: 100%; background: rgba(255,255,255,0.1); height: 8px; border-radius: 4px; overflow: hidden; position: relative;">
                <div id="profile-rank-progress"
                    style="height: 100%; width: 0%; background: var(--gold-primary); box-shadow: 0 0 10px var(--gold-primary); transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);">
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; margin-top: 8px;">
                <span id="profile-next-rank-text" style="font-size: 12px; color: var(--text-muted);">متبقي
                    -- للرتبة
                    القادمة</span>
                <span id="profile-next-rank-name"
                    style="font-size: 12px; color: var(--text-muted); font-weight: bold;">محارب <i
                        class="fa-solid fa-lock fa-fw" style="font-size: 10px;"></i></span>
            </div>
        </div>
        <div class="profile-form">
            <label class="profile-label">الاسم</label>
            <input type="text" id="profile-name-input">
            <button id="save-profile-btn" class="gold-btn">حفظ التعديلات</button>
        </div>

        <hr style="border-top: 1px solid var(--border-color); margin: 30px 0;">
        <h3 class="gold-text" style="text-align: right; margin-bottom: 15px;">🛡️ خزانة الأوسمة (Trophies)
        </h3>
        <div id="badges-container" style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
            <p style="color: var(--text-muted); font-size: 14px; width: 100%; text-align: right;">لا توجد
                أوسمة حتى
                الآن. شارك واصمد للنهاية!</p>
        </div>
    </div>
    <div class="glass-card" style=" text-align: center; max-width: 500px; margin: 15px auto;">
        <h3 class="gold-text" style="margin-bottom: 10px; font-size: 18px;">إعدادات الجهاز ⚙️</h3>
        <p style="font-size: 14px; color: #ccc; margin-bottom: 15px;">
            إذا لم تكن تصلك الإشعارات، اضغط هنا لربط هذا الجهاز لتلقي تنبيهات المعسكر.
        </p>
        <button id="manual-notify-btn" class="gold-btn" style="width: 100%;">تفعيل الإشعارات 🔔</button>
    </div>
</section>
